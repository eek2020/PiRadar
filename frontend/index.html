<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#071014">
    <title>PiRadar</title>
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="appliance">
      <header class="status-rail">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><strong>PiRadar</strong></div>
        <div id="connection" class="connection" data-state="starting"><span class="status-dot"></span><span>Starting</span></div>
        <time id="clock">--:--:--Z</time>
      </header>

      <section class="map-panel" aria-label="Nearby aircraft map">
        <div id="map"></div>
        <button id="home-control" class="home-control" type="button" aria-label="Centre map on home position">⌖</button>
        <div id="message" class="message">Initialising map…</div>

        <aside id="detail" class="detail" hidden>
          <button id="close-detail" aria-label="Close aircraft details">×</button>
          <p class="eyebrow">Selected aircraft</p>
          <h2 id="detail-callsign">—</h2>
          <dl>
            <div><dt>Altitude</dt><dd id="detail-altitude">—</dd></div>
            <div><dt>Speed</dt><dd id="detail-speed">—</dd></div>
            <div><dt>Distance</dt><dd id="detail-distance">—</dd></div>
            <div><dt>Track</dt><dd id="detail-track">—</dd></div>
            <div><dt>Vertical</dt><dd id="detail-vertical">—</dd></div>
            <div><dt>ICAO</dt><dd id="detail-hex">—</dd></div>
          </dl>
        </aside>
      </section>

      <footer class="info-rail">
        <span><strong id="aircraft-count">0</strong> aircraft</span>
        <span>Range <strong id="range">--</strong> NM</span>
        <span id="attribution" class="caveat">Informational display · not for navigation</span>
      </footer>
    </main>
    <script src="/vendor/leaflet/leaflet.js"></script>
    <script src="/app.js" defer></script>
  </body>
</html>
